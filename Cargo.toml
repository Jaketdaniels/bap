[workspace]
resolver = "2"
members = [
  "crates/bap_core",
  "crates/bap_ops",
  "crates/bap_metrics",
  "crates/bap_cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/sirwillchris/kyx-link-generator"

[workspace.dependencies]
deno_core = { version = "0.410", features = ["include_icu_data"] }
deno_ops = "0.286"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_v8 = "0.319"
tracing = "0.1"
anyhow = "1"
