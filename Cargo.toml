[workspace]
resolver = "2"
members = [
  "crates/bap_core",
  "crates/bap_math",
  "crates/bap_ops",
  "crates/bap_metrics",
  "crates/bap_ts",
  "crates/bap_cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
deno_core = { version = "0.410", features = ["include_icu_data"] }
deno_ops = "0.286"
deno_error = { version = "=0.7.1", features = ["serde_json", "serde", "url", "tokio"] }
hdrhistogram = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_v8 = "0.319"
reqwest = { version = "0.12", default-features = false }
tokio = { version = "1", features = ["fs", "net", "rt", "time", "macros"] }
tracing = "0.1"
