name: ci
on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix tools/ts-proof ci
      - run: npm --prefix tools/ts-proof test
      - run: ./tools/ts-proof/node_modules/.bin/tsc --noEmit crates/bap_ops/tests/types/numeric.ts
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check public crates for semver violations
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          rust-toolchain: stable

  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build -p bap_cli
      - name: Run compatibility corpus (report-only)
        run: |
          BAP_BIN=target/debug/bap node bench/compat/run.mjs
          target/debug/bap report compat
