name: ci
on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix tools/ts-proof ci
      - run: npm --prefix tools/ts-proof test
      - run: ./tools/ts-proof/node_modules/.bin/tsc --noEmit crates/bap_ops/tests/types/numeric.ts
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # cargo-semver-checks is skipped: no bap crate publishes to crates.io
  # (distribution is GitHub Releases). Revisit if that changes.

  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build -p bap
      - name: Run compatibility corpus (report-only)
        run: |
          BAP_BIN=target/debug/bap node bench/compat/run.mjs
          target/debug/bap report compat

  bench-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p bap
      - name: 20-iteration smoke benchmark (report-only)
        run: |
          target/release/bap bench bench/smoke.mjs --warmup 2 --iterations 20

  docs-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate man pages and fail on drift
        run: |
          cargo run -q -p bap --example mangen -- /tmp/man-check
          for page in /tmp/man-check/*.1; do
            name=$(basename "$page")
            if ! cmp -s "$page" "docs/man/$name"; then
              echo "::error::docs/man/$name drifted from the CLI definition"
              diff "$page" "docs/man/$name" || true
              exit 1
            fi
          done
