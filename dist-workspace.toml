[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
# aarch64 musl is excluded: V8's FlushICache needs __clear_cache, which
# fully-static arm64 musl links cannot resolve (rusty_v8 limitation).
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Static musl binaries link against nothing system-specific
# CI behavior: PRs plan-only; real uploads happen on tag pushes
pr-run-mode = "plan"
